<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Zambia Police Service</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center p-4 bg-cover bg-center bg-no-repeat">
    <div class="w-full max-w-md bg-white rounded-xl shadow-xl border border-gray-100 overflow-hidden">
        <div class="bg-slate-900 px-6 py-8 text-center text-white relative">
            <div class="absolute bottom-0 left-0 w-full h-1.5 flex">
                <div class="w-1/4 h-full bg-[#007A33]"></div>
                <div class="w-1/12 h-full bg-[#E51636]"></div>
                <div class="w-1/12 h-full bg-[#000000]"></div>
                <div class="w-1/12 h-full bg-[#DE781F]"></div>
                <div class="flex-1 h-full bg-[#007A33]"></div>
            </div>
            <div class="mx-auto w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mb-4 border border-slate-700 shadow-inner">
                <i data-lucide="user-plus" class="w-8 h-8 text-amber-500"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide uppercase text-gray-100">Create Account</h1>
            <p class="text-xs text-slate-400 mt-1 font-medium tracking-wider uppercase">Officer Registration Portal</p>
        </div>

        <form class="p-6 space-y-4" onsubmit="handleCreateAccount(event)">
            <div>
                <label for="fullName" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Full Name</label>
                <input type="text" id="fullName" required class="block w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-inner placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-all" placeholder="Officer name">
            </div>
            <div>
                <label for="newForceNumber" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Force / Officer Number</label>
                <input type="text" id="newForceNumber" required class="block w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-inner placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-all" placeholder="e.g., ZP-12345">
            </div>
            <div>
                <label for="newEmail" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Email</label>
                <input type="email" id="newEmail" required class="block w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-inner placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-all" placeholder="officer@police.gov.zm">
            </div>
            <div>
                <label for="newPassword" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Password</label>
                <input type="password" id="newPassword" required class="block w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-inner placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-all" placeholder="Create password">
            </div>
            <div>
                <label for="confirmPassword" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Confirm Password</label>
                <input type="password" id="confirmPassword" required class="block w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-inner placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-all" placeholder="Confirm password">
            </div>
            <div>
                <label for="newStation" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Division / Station</label>
                <select id="newStation" required class="block w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-inner text-gray-700 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-all appearance-none">
                    <option value="" disabled selected>Select division</option>
                    <option value="kitwe_central">Kitwe Central Police Station</option>
                    <option value="lusaka_central">Lusaka Central Police Station</option>
                    <option value="ndola_central">Ndola Central Police Station</option>
                    <option value="chelstone">Chelstone Police Station</option>
                </select>
            </div>
            <button type="submit" class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-md shadow-md text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all transform active:scale-[0.99]">
                <span>Create Account</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
            <p class="text-xs text-center text-gray-500">Already have an account? <a href="index.php" class="font-semibold text-slate-900 hover:underline">Sign in</a></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
